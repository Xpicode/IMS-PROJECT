<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · IMS</title>
    <style>
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: #111827;
        background: #f9fafb;
      }
      main {
        max-width: 28rem;
        margin: 0 auto;
        padding: 3rem 1.25rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.75rem;
      }
      p {
        line-height: 1.5;
        color: #374151;
      }
      a {
        display: block;
        margin-top: 1.5rem;
        padding: 0.9rem 1rem;
        border-radius: 0.6rem;
        background: #1d4ed8;
        color: #fff;
        text-align: center;
        font-weight: 600;
        text-decoration: none;
        font-size: 1.05rem;
      }
      button {
        margin-top: 0.75rem;
        width: 100%;
        padding: 0.9rem 1rem;
        border-radius: 0.6rem;
        border: 1px solid #6b7280;
        background: #fff;
        font-size: 1.05rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>This page needs internet. Counting still works without internet if you downloaded your assignment earlier.</p>
      <a href="/field">Open field counting</a>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
